<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    .cedarville-cursive-regular {
  font-family: "Cedarville Cursive", cursive;
  font-weight: 400;
  font-style: normal;
}
  </style>
</head>

<body>
    <main>
        <section class="head">
            <img src="navicon.png" alt="">
            <nav>
                <h1>New Arrivals</h1>
                <h1>Shop</h1>
                <h1>Buauty</h1>
                <h1>Sale</h1>
                <h1>Journal</h1>
            </nav>
            <div class="icons">
                <i class="ri-search-line"></i>
                <i class="ri-nodejs-line"></i>
                <p><i class="ri-shopping-cart-line"></i></p>
            </div>
        </section>
        <section class="conetent-left">
            <img src="download (8).png" alt="">
            <div class="conetent-left-content">
                <h5>summer Collection</h5>
                <p>TRANDY AND <br />CLUSSI FOR<br />NEW SEASSON</p>
            </div>
        </section>
        <section class="conetent-center">
            <h1>Make Your Fashion Look<br />More Charming</h1>
        </section>
        <section class="conetent-right">
            <img src="download (3).png" alt="">
            <div class="circle-text">
                <svg viewBox="0 0 200 200">

                    <path id="curve" d="M100,100
               m-70,0
               a70,70 0 1,1 140,0
               a70,70 0 1,1 -140,0" fill="transparent" />
                    <text>
                        <textPath href="#curve" startOffset="18%">
                            EXPLORE MORE COLLECTION ____________
                        </textPath>
                    </text>
                </svg>

                <span class="play">
                    <i class="ri-play-fill"></i>
                </span>
            </div>
        </section>
        <section class="img-up">
            <img src="download (7).png" alt="">
        </section>
        <section class="img-up1">
            <img src="download (1).png" alt="">
        </section>
        <section class="img1 img"></section>
        <section class="img2 img"></section>
        <section class="img3 img"></section>
        <section class="img-left img"></section>
        <section class="img-left-center img"></section>
        <section class="img-right-center img"></section>
        <section class="img-right img"></section>
        <section class="footer-left">
            <img src="download (5).png" alt="">
            <p>I'm very much of the 'buy less but buy<br />better philosophy.It's what I've never really knew</p>
            <p class="sign cedarville-cursive-regular"><em>JishLusipher</em></p>
        </section>
        <section class="footer-center">
            <img src="download.png" alt="">
            <select name="" id="">
                <option value="">Scroll Down</option>
                <option value="">Option1</option>
                <option value="">Option2</option>
            </select>
        </section>
        <section class="footer-right">
            <img src="download (2).png" alt="">
            <div class="footer-content">
                <span><i class="ri-number-0"></i><i class="ri-number-1"></i></span>
                <h3>Always be strong<br />and have value</h3>
                <p class="arrow"><i class="ri-arrow-right-line"></i></p>
            </div>
        </section>
    </main>
</body>

</html>

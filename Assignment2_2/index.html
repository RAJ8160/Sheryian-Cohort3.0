<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index.html</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="logo.png" alt="Thisis Logo" />
                <p class="name">ScaleX</p>
            </div>

            <div class="nav">
                <p class="nav-tag">Home</p>
                <p class="nav-tag">About us</p>
                <p class="nav-tag">Blogs</p>
                <p class="nav-tag">Contact Us</p>
            </div>

            <button class="header-btn">Get Started</button>
        </div>
        <div class="hero">
            <section class="text">
                Insights & Blogs
            </section>
            <section class="group-btn">
                <button class="btn">All</button>
                <button class="btn">Tech</button>
                <button class="btn">Saas</button>
                <button class="btn">Marketing</button>
            </section>
            <section class="cards">
                <div class="card">
                    <img src="glass.png" alt="This is Glass Image">
                    <p class="cat">Tech</p>
                    <h3>The UltimateGuide To <br />Saas Marketing</h3>
                    <p class="date">May 23, 2025</p>
                </div>
                <div class="card">
                    <img src="chair.png" alt="This is chair Image">
                    <p class="cat">Tech</p>
                    <h3>5 Key Trands in SaaS <br/>Growth Fro 2025</h3>
                    <p class="date">May 23, 2025</p>
                </div>
                <div class="card">
                    <img src="cat.png" alt="This is Cat Image">
                    <p class="cat">Tech</p>
                    <h3>How Data - Driven <br />Strategy Are important.</h3>
                    <p class="date">May 23, 2025</p>
                </div>
            </section>
        </div>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project2.html</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <div class="head">
      <img src="Squid1.png" alt="This is SquidGame image" />
      <div class="nav">
        <p class="nav-items">About</p>
        <p class="nav-items">Watch Now</p>
        <p class="nav-items">Actors</p>
        <p class="nav-items">Contacts</p>
      </div>
      <i class="ri-menu-3-line"></i>
    </div>
    <div class="main">
      <div class="left">
        <img src="squid2.png" alt="This is Squid2 image." />
        <p>Action/Thrill/Drama Series directed by Dong-hyukHWag<br />Season 1:9 Episodes </p>
        <div class="btn-group">
          <button class="btn play"><i class="ri-play-circle-fill"></i> Play Now</button>
          <button class="btn trailer"><i class="ri-play-fill"></i> Watch Trailler</button>
        </div>
      </div>
      <div class="mid">
        <p class="scroll">
          SCROLL ------------
        </p>
        <img src="bas.png" alt="This is guird image.">
        <div class="icons">
          <i class="ri-twitter-line"></i>
          <i class="ri-instagram-line"></i>
          <i class="ri-facebook-line"></i>
        </div>
        <div class="side-text">
          SQUARD
        </div>
        <div class="below-text">
          GAME
        </div>

        <div class="finish">
          <img src="download 2.jpg" alt="This is about SquadGame">
          <img src="download3.jpg" alt="This is about SquadGame">
          <img src="download4.jpg" alt="This is about SquadGame">
        </div>
      </div>
    </div>
  </div>
